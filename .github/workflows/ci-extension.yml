name: CI · Extension

on:
  pull_request:
    paths: ['apps/extension/**', 'packages/**', '.github/workflows/ci-extension.yml']
  push:
    branches: [main]
    paths: ['apps/extension/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck test --filter=@nightreel/extension
      - run: pnpm --filter @nightreel/extension zip
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: apps/extension/.output/*.zip
